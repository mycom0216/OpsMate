# 기존 프로젝트와 분리한 OpsMate 전용 Docker 및 MariaDB 통합 검증 환경입니다.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${VERIFY_DB_PASSWORD:?검증 전용 비밀번호 필요}
      MARIADB_DATABASE: opsmate_verify
      MARIADB_USER: opsmate
      MARIADB_PASSWORD: ${VERIFY_DB_PASSWORD}
    volumes:
      - verify-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 25
  opsmate:
    build:
      context: ..
    environment:
      DB_DRIVER: mariadb
      MARIADB_URL: mariadb://opsmate:${VERIFY_DB_PASSWORD}@db:3306/opsmate_verify
      DEMO_MODE: "true"
      AI_ENABLED: "false"
    ports:
      - "127.0.0.1:3102:3100"
    volumes:
      - verify-app:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  verify-db:
  verify-app:
